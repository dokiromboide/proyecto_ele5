version: "3.9"

# ============================================================
# Docker Compose DEV - Overrides para desarrollo local
# Uso: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
# ============================================================

services:
  backend:
    build:
      target: development
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    environment:
      APP_ENV: development
      APP_DEBUG: "true"

  frontend:
    build:
      target: development
    command: npm run dev -- --host 0.0.0.0 --port 3000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000

  db:
    ports:
      - "5432:5432"
